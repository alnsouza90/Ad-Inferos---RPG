name: APK Android

# Monta o APK de teste (T17). No PR, só confere que monta e guarda o arquivo
# como artefato. Na main, publica na página de versões ("Releases") com o
# nome fixo "teste-android", para Alan baixar pelo celular.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  apk:
    name: Montar APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Baixar Godot e modelos de exportação
        run: |
          # Download com novas tentativas: o arquivo às vezes chega incompleto (PR #44).
          fetch() {
            for i in 1 2 3; do
              if curl -fsSL --retry 3 --retry-all-errors -o "$2" "$1" && unzip -tq "$2" >/dev/null; then return 0; fi
              echo "Download incompleto de $2 (tentativa $i); tentando de novo"; sleep $((i * 5))
            done
            return 1
          }
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          fetch "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" godot.zip
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          fetch "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" templates.tpz
          unzip -q templates.tpz
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          mv templates/android_debug.apk templates/android_release.apk templates/version.txt "$dest/"
          rm -rf templates templates.tpz

      - name: Configurar SDK Android e chave de teste
        run: |
          # O Godot lê os caminhos do SDK e do Java das configurações do editor.
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOT
          sed -i 's/^ *//' "$HOME/.config/godot/editor_settings-4.7.tres"
          # Chave de depuração descartável: só para instalar o APK de teste.
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" -alias androiddebugkey \
            -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Importar recursos
        run: godot --headless --path game --import || true

      - name: Exportar APK
        run: |
          mkdir -p builds/android
          godot --headless --path game --export-debug "Android" ../builds/android/ad-inferos.apk
          test -f builds/android/ad-inferos.apk
          ls -la builds/android

      - uses: actions/upload-artifact@v4
        with:
          name: ad-inferos-apk
          path: builds/android/ad-inferos.apk

      - name: Publicar na página de versões
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete teste-android --cleanup-tag --yes || true
          gh release create teste-android builds/android/ad-inferos.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "APK de teste (M0)" \
            --notes "Versão de teste para Android, montada a partir de ${GITHUB_SHA::7}. Baixe ad-inferos.apk pelo celular e instale (permita instalar de fonte desconhecida)."
