name: Testes

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  gut:
    name: GUT (sem tela)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Baixar Godot ${{ env.GODOT_VERSION }}
        run: |
          # Download com novas tentativas: o arquivo às vezes chega incompleto (PR #44).
          fetch() {
            for i in 1 2 3; do
              if curl -fsSL --retry 3 --retry-all-errors -o "$2" "$1" && unzip -tq "$2" >/dev/null; then return 0; fi
              echo "Download incompleto de $2 (tentativa $i); tentando de novo"; sleep $((i * 5))
            done
            return 1
          }
          fetch "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" godot.zip
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Importar recursos
        run: godot --headless --path game --import || true

      - name: Verificar scripts (erros de sintaxe e tipo)
        run: |
          status=0
          for f in $(cd game && find . -name '*.gd' -not -path './addons/*' | sed 's|^\./||'); do
            out=$(godot --headless --path game --check-only -s "res://$f" 2>&1) || true
            if echo "$out" | grep -qE "SCRIPT ERROR|Parse Error"; then
              echo "::error file=game/$f::Erro ao analisar o script"
              echo "$out" | grep -E "SCRIPT ERROR|Parse Error|at: " | head -20
              status=1
            fi
          done
          exit $status

      - name: Rodar testes
        run: |
          set -o pipefail
          godot --headless --path game -s addons/gut/gut_cmdln.gd -gdir=res://tests -ginclude_subdirs -gexit 2>&1 | tee gut.log
          # O GUT ignora em silêncio scripts de teste com erro; isso precisa falhar.
          if grep -qE "Ignoring script|Parse Error|SCRIPT ERROR" gut.log; then
            echo "::error::Algum script de teste foi ignorado ou tem erro"
            exit 1
          fi

      - name: Conferir dados gerados
        run: godot --headless --path game -s res://tools/data/import_balance.gd -- --check
