# RASCUNHO do agente (D-122), revisado com Alan (D-141): Alan aprova antes do merge.
# Tema escolhido por Alan (T23): "O abrigo do vento", como eco da tentação do
# Peregrino (GDD §9): os rastros parecem levar à tenda, mas ele nunca esteve lá;
# é a voz mentindo. O vento incessante vem do Círculo 2 de Dante (Inferno,
# canto V); a tenda e a voz são criação do jogo. Números aprovados por Alan (D-140).
id: c02_temptation_wind_shelter
type: temptation
circle: 2
title_pt: "O abrigo do vento"
origin: game_fiction
pages:
  - speaker: narrator
    text_pt: "O vento do segundo círculo não cessa. Na areia revolvida, os rastros do Peregrino parecem desviar do caminho e entrar numa tenda clara, quieta, como se a tempestade não a tocasse."
  - speaker: demon_tempter
    text_pt: "Ele estava cansado de lutar contra o vento. Aqui há calor, perfume e silêncio. Deixai-o descansar. Por que arrancá-lo daqui?"
  - speaker: narrator
    text_pt: "De dentro da tenda, nenhum som. Os santos se entreolham."
options:
  - id: follow_tracks
    text_pt: "Seguir os rastros pela tempestade"
    safe: true
    result_pt: "A companhia dá as costas à tenda. Mais adiante, sob a areia, os rastros verdadeiros do Peregrino seguem contra o vento."
    outcomes:
      - { type: light, amount: -5 }
  - id: enter_tent
    text_pt: "Entrar na tenda atrás do Peregrino"
    chance:
      base: 0.5
      modifiers:
        - { if: saint_in_party, id: saint_benedict, add: 0.2 }
        - { if: provision, id: holy_water, add: 0.2, consume: true }
    success_pt: "A tenda está vazia. Era só a voz, imitando os passos dele. A ilusão se desfaz, e os santos reencontram os rastros verdadeiros."
    failure_pt: "A tenda está vazia, mas o perfume pesa e o tempo escorre. Quando os santos saem, o vento já apagou os rastros; lá adiante, o Peregrino caminha mais só."
    on_success:
      - { type: desolation, target: party, amount: -15 }
    on_failure:
      - { type: virtue, id: virtue_hope, amount: -1 }
      - { type: desolation, target: party, amount: 15 }
  - id: pray_for_pilgrim
    text_pt: "Rezar pelo Peregrino diante da tenda"
    requires:
      - { type: virtue_at_least, id: virtue_faith, value: 3 }
    result_pt: "A oração atravessa a tempestade. A tenda se desfaz em pano e areia, e os rastros verdadeiros reaparecem adiante."
    outcomes:
      - { type: desolation, target: party, amount: -10 }
